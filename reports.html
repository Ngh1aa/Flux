<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flux - Reports</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Brutalist Bar Chart */
    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: var(--spacing-4);
      height: 200px;
      padding-top: var(--spacing-6);
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--spacing-4);
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-2);
    }
    .bar {
      width: 100%;
      background-color: var(--color-border-strong);
      transition: height 0.3s ease;
    }
    .bar.highlight {
      background-color: var(--color-accent);
    }
    .bar-label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--color-text-muted);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div style="padding: var(--spacing-6); font-weight: 600; font-size: 14px; letter-spacing: 0;">
        ACME CORP GLOBAL
      </div>
      
      <div class="role-switcher">
        <div class="role-tab active">Employee</div>
        <div class="role-tab">Approver</div>
      </div>

      <nav style="flex: 1;">
        <ul class="nav-list">
          <li><a href="accounts.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"></rect><line x1="3" y1="9" x2="21" y2="9"></line></svg>Accounts</a></li>
          <li><a href="index.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>Payments</a></li>
          <li><a href="cards.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>Cards</a></li>
          <li><a href="team.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>Team</a></li>
          <li><a href="expenses.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path><path d="M16 14h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path></svg>Expenses</a></li>
          <li><a href="reports.html" class="nav-link active"><svg class="icon" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>Reports</a></li>
          <li><a href="settings.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Settings</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div style="font-size: 13px; color: var(--color-text-secondary);">Reports</div>
        <div style="display: flex; align-items: center; gap: var(--spacing-4);">
          <div style="font-size: 13px; font-weight: 500;">J. Smith</div>
        </div>
      </header>

      <div class="page-content">
        <div style="margin-bottom: var(--spacing-6); display: flex; justify-content: space-between; align-items: flex-end;">
          <div>
            <h1 style="font-size: 20px; margin-bottom: var(--spacing-1);">Financial Summaries</h1>
            <p class="text-sm text-secondary">YTD Spend vs Budget Variance.</p>
          </div>
          <button class="btn btn-secondary">Download PDF</button>
        </div>

        <div class="surface" style="margin-bottom: var(--spacing-6);">
          <h2 style="font-size: 14px; margin-bottom: var(--spacing-4);">Q3 Operations Outflow</h2>
          
          <!-- Simple CSS Bar Chart -->
          <div class="bar-chart">
            <div class="bar-col"><div class="bar" style="height: 40%;"></div><span class="bar-label">Apr</span></div>
            <div class="bar-col"><div class="bar" style="height: 55%;"></div><span class="bar-label">May</span></div>
            <div class="bar-col"><div class="bar" style="height: 35%;"></div><span class="bar-label">Jun</span></div>
            <div class="bar-col"><div class="bar highlight" style="height: 85%;"></div><span class="bar-label">Jul</span></div>
            <div class="bar-col"><div class="bar" style="height: 60%;"></div><span class="bar-label">Aug</span></div>
            <div class="bar-col"><div class="bar" style="height: 45%;"></div><span class="bar-label">Sep</span></div>
          </div>
          
          <div style="display: flex; justify-content: space-between; margin-top: var(--spacing-4);">
            <div>
              <div class="text-xs text-muted">PEAK SPEND (JULY)</div>
              <div class="mono" style="font-size: 16px; font-weight: 500;">$214,500.00</div>
            </div>
            <div style="text-align: right;">
              <div class="text-xs text-muted">AVERAGE SPEND</div>
              <div class="mono" style="font-size: 16px; font-weight: 500;">$142,000.00</div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</body>
</html>
