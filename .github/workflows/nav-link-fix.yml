name: Temporary navigation link fix

on:
  push:
    branches:
      - tmp-nav-fix-runner2

permissions:
  contents: write

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-nav-fix-runner2
      - name: Wire legacy navigation to workspace routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          routes = [
              'accounts.html',
              'cards.html',
              'team.html',
              'expenses.html',
              'reports.html',
          ]

          for filename in ('index.html', 'settings.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count('href="#"') < len(routes):
                  raise SystemExit(f'{filename}: expected at least {len(routes)} placeholder nav links')
              for route in routes:
                  text = text.replace('href="#"', f'href="{route}"', 1)
              for route in routes:
                  if f'href="{route}"' not in text:
                      raise SystemExit(f'{filename}: missing {route} after rewrite')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit navigation wiring
        shell: bash
        run: |
          if git diff --quiet -- index.html settings.html; then
            echo "Navigation already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html settings.html
          git commit -m "fix: wire legacy navigation to workspace pages"
          git push origin HEAD:tmp-nav-fix-runner2
